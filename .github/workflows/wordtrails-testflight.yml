name: Word Trails to TestFlight
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40-character commit from krabople/WordTrails-iOS
        required: true
        type: string
      setup_only:
        description: Register the Word Trails bundle and profile without uploading
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: wordtrails-testflight
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      APP_BUNDLE_ID: com.krabople.wordtrails
      TEAM_ID: 6YYA8L76Y8
      APP_NAME: Word Trails
      BUILD_NUMBER: ${{ github.run_number }}
      MARKETING_VERSION: 1.1.0
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Validate immutable source reference
        working-directory: ${{ github.workspace }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
      - name: Check out Word Trails
        uses: actions/checkout@v6
        with:
          repository: krabople/WordTrails-iOS
          ref: ${{ inputs.source_ref }}
          path: source
          ssh-key: ${{ secrets.WORDTRAILS_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify checked-out revision
        run: |
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REF" ]]
          printf 'Word Trails source: `%s`\n' "$SOURCE_REF" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate signing configuration
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            [[ -n "${!name:-}" ]] || { printf 'Missing signing secret: %s\n' "$name" >&2; exit 1; }
          done
      - name: Import existing distribution certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
      - name: Identify signing certificate
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          identities=subprocess.check_output(['security','find-identity','-v','-p','codesigning','signing_temp.keychain'],text=True)
          matches=sorted(set(re.findall(r'\b([0-9A-F]{40})\s+"(?:Apple Distribution|iPhone Distribution):[^"\n]+\(' + re.escape(os.environ['TEAM_ID']) + r'\)"',identities)))
          if len(matches)!=1: raise SystemExit('Expected one imported team distribution identity')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('CERTIFICATE_SHA1='+matches[0]+'\n')
              f.write('SIGNING_DIR='+os.path.join(os.environ['RUNNER_TEMP'],'wordtrails-signing')+'\n')
          PY
      - name: Set up Word Trails bundle, Game Center and profile
        id: apple
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: node scripts/apple-setup.mjs --apply --output-dir "$SIGNING_DIR"
      - name: Report Apple setup
        run: |
          node --input-type=module - <<'JS'
          import {readFile,appendFile} from 'node:fs/promises';
          const m=JSON.parse(await readFile(`${process.env.SIGNING_DIR}/manifest.json`));
          await appendFile(process.env.GITHUB_STEP_SUMMARY,`\nBundle: ${m.bundleId}\nApp record: ${m.appId || 'Create Word Trails in App Store Connect using this bundle ID.'}\n`);
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: WordTrails-signing-summary
          path: ${{ runner.temp }}/wordtrails-signing/manifest.json
          retention-days: 7
      - name: Require app record for upload
        if: ${{ !inputs.setup_only && steps.apple.outputs.app_record_required == 'true' }}
        run: echo 'Create the Word Trails app record in App Store Connect before uploading.' >&2; exit 1
      - name: Test game engine
        if: ${{ !inputs.setup_only }}
        run: swift test -c release --parallel
      - name: Prepare Xcode project
        if: ${{ !inputs.setup_only }}
        run: |
          brew install xcodegen
          swift Support/make-icon.swift App/Assets.xcassets/AppIcon.appiconset
          xcodegen generate
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$SIGNING_DIR"/*.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: Archive signed iPhone app
        if: ${{ !inputs.setup_only }}
        env:
          PROFILE_UUID: ${{ steps.apple.outputs.profile_uuid }}
        run: |
          set -o pipefail
          xcodebuild archive -project WordTrails.xcodeproj -scheme WordTrails -configuration Release -destination 'generic/platform=iOS' -archivePath .build/WordTrails.xcarchive WORDTRAILS_CERTIFICATE_SHA1="$CERTIFICATE_SHA1" WORDTRAILS_PROFILE_UUID="$PROFILE_UUID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" | tee .build/archive.log
          xcodebuild -exportArchive -archivePath .build/WordTrails.xcarchive -exportOptionsPlist "$SIGNING_DIR/ExportOptions.plist" -exportPath .build/export
      - name: Verify packaged version before upload
        if: ${{ !inputs.setup_only }}
        run: |
          python3 - <<'PY'
          import os,plistlib
          path='.build/WordTrails.xcarchive/Products/Applications/WordTrails.app/Info.plist'
          with open(path,'rb') as f: info=plistlib.load(f)
          expected={'CFBundleIdentifier':os.environ['APP_BUNDLE_ID'],'CFBundleShortVersionString':os.environ['MARKETING_VERSION'],'CFBundleVersion':os.environ['BUILD_NUMBER']}
          for key,value in expected.items():
              if str(info.get(key))!=value: raise SystemExit(f'Archive metadata mismatch for {key}: expected {value}, got {info.get(key)}')
          print('Verified packaged bundle, version and build:',expected)
          PY
      - name: Upload to TestFlight
        if: ${{ !inputs.setup_only }}
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: source/.build/export/WordTrails.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          wait-for-processing: 'false'
      - name: Verify Apple processed the exact uploaded build
        if: ${{ !inputs.setup_only }}
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_APP_ID: ${{ steps.apple.outputs.app_id }}
        run: node scripts/verify-testflight.mjs --output .build/testflight-processing.json
      - uses: actions/upload-artifact@v7
        if: ${{ always() && !inputs.setup_only }}
        with:
          name: WordTrails-TestFlight
          path: |
            source/.build/export/*.ipa
            source/.build/testflight-processing.json
            source/.build/archive.log
          retention-days: 14
