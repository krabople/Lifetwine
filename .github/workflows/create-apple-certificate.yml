name: Create Apple distribution certificate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/create-apple-certificate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-certificate:
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Create Apple distribution certificate
        env:
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          ruby <<'RUBY'
          require "base64"
          require "json"
          require "net/http"
          require "openssl"
          require "uri"

          def base64url(value)
            Base64.urlsafe_encode64(value).delete("=")
          end

          def fixed_width_integer(value)
            [value.to_i.to_s(16).rjust(64, "0")].pack("H*")
          end

          now = Time.now.to_i
          header = base64url({ alg: "ES256", kid: ENV.fetch("ASC_KEY_ID"), typ: "JWT" }.to_json)
          payload = base64url({ iss: ENV.fetch("ASC_ISSUER_ID"), iat: now, exp: now + 900, aud: "appstoreconnect-v1" }.to_json)
          unsigned_token = "#{header}.#{payload}"

          key = OpenSSL::PKey.read(ENV.fetch("ASC_PRIVATE_KEY"))
          digest = OpenSSL::Digest::SHA256.digest(unsigned_token)
          der_signature = key.dsa_sign_asn1(digest)
          signature_parts = OpenSSL::ASN1.decode(der_signature).value
          signature = base64url(signature_parts.map { |part| fixed_width_integer(part.value) }.join)
          token = "#{unsigned_token}.#{signature}"

          uri = URI("https://api.appstoreconnect.apple.com/v1/certificates")
          request = Net::HTTP::Post.new(uri)
          request["Authorization"] = "Bearer #{token}"
          request["Content-Type"] = "application/json"
          request.body = {
            data: {
              type: "certificates",
              attributes: {
                certificateType: "DISTRIBUTION",
                csrContent: File.read("Signing/Lifetwine.certSigningRequest")
              }
            }
          }.to_json

          response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(request) }
          unless response.is_a?(Net::HTTPSuccess)
            abort "Apple certificate request failed (#{response.code}): #{response.body}"
          end

          certificate = JSON.parse(response.body).fetch("data")
          attributes = certificate.fetch("attributes")
          File.binwrite("LifetwineDistribution.cer", Base64.decode64(attributes.fetch("certificateContent")))
          File.write("certificate-metadata.json", JSON.pretty_generate({
            id: certificate.fetch("id"),
            serialNumber: attributes["serialNumber"],
            expirationDate: attributes["expirationDate"]
          }))
          RUBY

      - name: Preserve certificate
        uses: actions/upload-artifact@v7
        with:
          name: Lifetwine-Apple-Distribution-Certificate
          path: |
            LifetwineDistribution.cer
            certificate-metadata.json
          if-no-files-found: error

