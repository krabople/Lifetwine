name: Rename App Store listing to Listello

on:
  push:
    branches: [morrow-release]
    paths:
      - Support/listello-name-trigger

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    env:
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      APP_STORE_APP_ID: "6809041904"
      NEW_APP_NAME: "Listello"
    steps:
      - name: Update App Store Connect name
        run: |
          ruby <<'RUBY'
          require "base64"
          require "json"
          require "net/http"
          require "openssl"
          require "uri"

          def base64url(value)
            Base64.urlsafe_encode64(value).delete("=")
          end

          def fixed_width(value)
            [value.to_i.to_s(16).rjust(64, "0")].pack("H*")
          end

          def request(method, path, token, body = nil)
            uri = URI("https://api.appstoreconnect.apple.com#{path}")
            req = method == :get ? Net::HTTP::Get.new(uri) : Net::HTTP::Patch.new(uri)
            req["Authorization"] = "Bearer #{token}"
            req["Content-Type"] = "application/json"
            req.body = body.to_json if body
            response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }
            unless response.code.to_i.between?(200, 299)
              abort "App Store Connect request failed (#{response.code}): #{response.body}"
            end
            response.body.empty? ? {} : JSON.parse(response.body)
          end

          now = Time.now.to_i
          header = base64url({ alg: "ES256", kid: ENV.fetch("APPSTORE_KEY_ID"), typ: "JWT" }.to_json)
          payload = base64url({ iss: ENV.fetch("APPSTORE_ISSUER_ID"), iat: now, exp: now + 900, aud: "appstoreconnect-v1" }.to_json)
          unsigned = "#{header}.#{payload}"
          key = OpenSSL::PKey.read(ENV.fetch("APPSTORE_PRIVATE_KEY"))
          signature = key.dsa_sign_asn1(OpenSSL::Digest::SHA256.digest(unsigned))
          parts = OpenSSL::ASN1.decode(signature).value
          token = "#{unsigned}.#{base64url(parts.map { |part| fixed_width(part.value) }.join)}"

          app_id = ENV.fetch("APP_STORE_APP_ID")
          app_infos = request(:get, "/v1/apps/#{app_id}/appInfos", token).fetch("data")
          abort "No app information record found" if app_infos.empty?

          localizations = app_infos.flat_map do |info|
            request(:get, "/v1/appInfos/#{info.fetch("id")}/appInfoLocalizations", token).fetch("data")
          end
          abort "No app information localization found" if localizations.empty?

          target = localizations.find { |item| ["Quiet List", "Morrow: Calm Task Planner", "Morrow"].include?(item.dig("attributes", "name")) } || localizations.first
          current_name = target.dig("attributes", "name")
          puts "Current App Store name: #{current_name}"

          if current_name == ENV.fetch("NEW_APP_NAME")
            puts "App Store name is already Listello."
            exit 0
          end

          body = {
            data: {
              type: "appInfoLocalizations",
              id: target.fetch("id"),
              attributes: { name: ENV.fetch("NEW_APP_NAME") }
            }
          }
          request(:patch, "/v1/appInfoLocalizations/#{target.fetch("id")}", token, body)
          puts "Updated App Store name to #{ENV.fetch("NEW_APP_NAME")}."
          RUBY
